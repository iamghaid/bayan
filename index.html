<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بيان — الخطبة بلغة الإشارة السعودية</title>
  <style>body{margin:0;background:#f2f6f4;color:#17352c;font:16px/1.7 Tahoma,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;background:white;border-bottom:1px solid #dce7e1}h1{margin:0;font-size:26px}nav{display:flex;gap:6px;background:#edf3ef;padding:5px;border-radius:12px}button{font:inherit;border:0;border-radius:9px;background:transparent;color:#456356;padding:10px 18px;cursor:pointer}button[aria-selected=true]{background:#17654e;color:white}button:focus-visible{outline:3px solid #80bfa8}.view{height:calc(100dvh - 87px);min-height:480px}iframe{display:block;width:100%;height:100%;border:0}[hidden]{display:none!important}@media(max-width:650px){header{padding:12px;flex-wrap:wrap}nav{width:100%}nav button{flex:1;padding:10px 6px}.view{height:calc(100dvh - 137px)}}</style>
</head>
<body>
  <header><h1>بيان</h1><nav role="tablist" aria-label="مساحات بيان"><button id="speechTab" role="tab" aria-selected="true" aria-controls="speechPanel">الخطبة والصوت</button><button id="reviewTab" role="tab" aria-selected="false" aria-controls="reviewPanel" tabindex="-1">مراجعة الحركات</button></nav></header>
  <section class="view" id="speechPanel" role="tabpanel" aria-labelledby="speechTab"><iframe id="speechFrame" title="الخطبة والصوت" allow="microphone" src="khutbah.html?embedded=1"></iframe></section>
  <section class="view" id="reviewPanel" role="tabpanel" aria-labelledby="reviewTab" hidden><iframe id="reviewFrame" title="مراجعة الحركات"></iframe></section>
  <script src="workspace.js?v=1"></script>
</body>
</html>
