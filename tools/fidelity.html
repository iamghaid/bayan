<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Bayan fidelity harness</title></head>
<body>
<!-- Driven by tools/fidelity_report.js: plays each motion on the real avatar and compares it,
     frame by frame, with the landmarks MediaPipe extracted from the source video. -->
<canvas id="cv" width="320" height="320"></canvas>
<script src="../lib/three.min.js"></script>
<script src="../lib/GLTFLoader.js"></script>
<script src="../lib/three-vrm.min.js"></script>
<script>
  // Measurement only: skip GPU drawing and drive frames manually for repeatable timing.
  window.requestAnimationFrame = () => 0;
  const BaseRenderer = THREE.WebGLRenderer;
  THREE.WebGLRenderer = function (options) { const r = new BaseRenderer(options); r.render = () => {}; return r; };
</script>
<script src="../man_dress.js"></script>
<script src="../handfix.js"></script>
<script src="../signfix.js"></script>
<script src="../signer.js"></script>
<script>
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const deg = (a, b) => (a.lengthSq() < 1e-12 || b.lengthSq() < 1e-12) ? null : a.angleTo(b) * 180 / Math.PI;
  const at = name => { const b = Signer._bone(name); return b && b.getWorldPosition(new THREE.Vector3()); };
  // Image landmarks -> avatar space: x = avatar's left, y = up, z = toward the camera.
  const img = (p, asp) => V(p[0] * asp, -p[1], -p[2] * asp);
  const world = p => V(p[0], -p[1], -p[2]);
  const FINGERS = { Index: [5, 6, 7], Middle: [9, 10, 11], Ring: [13, 14, 15], Little: [17, 18, 19] };
  const ARM = { Left: [3, 5, 7], Right: [4, 6, 8] };   // shoulder, elbow, wrist in w
  const BENT = 45;                                      // MCP + PIP flexion (deg) counted as a bent finger

  function compareHand(side, pts, asp) {
    const P = pts.map(p => img(p, asp));
    const hand = at(side + 'Hand'), out = { fingers: {} };
    out.dir = deg(P[9].clone().sub(P[0]), at(side + 'MiddleProximal').sub(hand));
    const nData = P[5].clone().sub(P[0]).cross(P[17].clone().sub(P[0]));
    const nAvatar = at(side + 'IndexProximal').sub(hand).cross(at(side + 'LittleProximal').sub(hand));
    out.palm = deg(nData, nAvatar);
    for (const [finger, [m, p, d]] of Object.entries(FINGERS)) {
      const a = [hand, at(side + finger + 'Proximal'), at(side + finger + 'Intermediate'), at(side + finger + 'Distal')];
      const dataCurl = deg(P[m].clone().sub(P[0]), P[p].clone().sub(P[m])) + deg(P[p].clone().sub(P[m]), P[d].clone().sub(P[p]));
      const avatarCurl = deg(a[1].clone().sub(a[0]), a[2].clone().sub(a[1])) + deg(a[2].clone().sub(a[1]), a[3].clone().sub(a[2]));
      out.fingers[finger] = { data: dataCurl, avatar: avatarCurl };
    }
    return out;
  }

  function compareArm(side, w) {
    const [s, e, h] = ARM[side].map(k => world(w[k]));
    return { upper: deg(e.clone().sub(s), at(side + 'LowerArm').sub(at(side + 'UpperArm'))),
             fore: deg(h.clone().sub(e), at(side + 'Hand').sub(at(side + 'LowerArm'))) };
  }

  window.measure = async (id, base = '../sshi_motion/m/') => {
    Signer.stop(); Signer._tick(30, 1 / 30);                 // settle at rest so motions are independent
    const d = await Signer.load(id, base);
    Signer.playList([{ motion: id }], null, base);
    await new Promise(resolve => setTimeout(resolve, 0));
    const samples = [];
    for (let k = 0; k < 4000; k++) {
      Signer._tick(1, 1 / 30);
      const state = Signer._dbg();
      if (!state || state.id !== id) break;
      const i = Math.floor(state.t * d.fps);
      if (i >= d.frames.length) break;
      if (state.t < 0.18) continue;                           // blend-in from rest is not part of the sign
      const frame = d.frames[i], sample = { i };
      for (const side of ['Left', 'Right']) {
        if (frame.hands && frame.hands[side]) sample[side] = { hand: compareHand(side, frame.hands[side], d.asp), arm: compareArm(side, frame.w) };
      }
      samples.push(sample);
    }
    return { id, fps: d.fps, frames: d.frames.length, samples };
  };
  window.ready = Signer.init(document.getElementById('cv'), '../avatar/man.glb').then(() => true);
</script>
</body>
</html>
