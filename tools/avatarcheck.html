<!doctype html><meta charset="utf-8"><title>Local avatar retarget check</title>
<style>body{font:16px sans-serif}canvas{width:min(500px,100%);height:440px}pre{white-space:pre-wrap}</style>
<canvas id="cv"></canvas><pre id="result">Loading avatar…</pre>
<script src="../lib/three.min.js"></script><script src="../lib/GLTFLoader.js"></script><script src="../lib/three-vrm.min.js"></script>
<script src="../man_dress.js?v=32"></script><script src="../handfix.js"></script><script src="../signfix.js"></script>
<script>
// A deterministic local-only test: real GLB, real active motions, no reference videos.
window.requestAnimationFrame = () => 0;
// Retain deterministic test renders for avatar-only screenshots in hidden tabs.
const RenderBase=THREE.WebGLRenderer;
THREE.WebGLRenderer=class extends RenderBase {constructor(options){super({...options,preserveDrawingBuffer:true});}};
const baseline = new URLSearchParams(location.search).has('baseline');
const script = document.createElement('script');
script.src = baseline ? '../coverage/research/signer_previous.js' : '../signer.js?v=solid-body-1';
script.onload = async () => {
  const out = document.getElementById('result');
  try {
    await Signer.init(document.getElementById('cv'), '../avatar/man.glb');
    const response=await fetch('../sshi_motion/needed.json'); let needed=await response.json();
    const requested=new URLSearchParams(location.search).get('motion');
    if(requested && /^\d+$/.test(requested)) needed=[{id:Number(requested)}];
    const base=new URLSearchParams(location.search).has('staged')?'../sshi_motion/staging/':'../sshi_motion/m/';
    const results=[];
    for (const item of needed.slice(0,80)) {
      const d=await Signer.load(item.id,base);
      await new Promise(resolve=>Signer.playList([{motion:item.id}],tag=>{if(Signer._dbg())resolve();},base));
      let prev={}, maxStep=0, jumpFrames=0, maxBodyOverlap=0, finite=true;
      const sheetMode=new URLSearchParams(location.search).has('sheet');
      let sheet,ctx,sample=0;
      if(sheetMode){sheet=document.createElement('canvas');sheet.width=1200;sheet.height=900;sheet.style.cssText='width:1200px;height:900px;max-width:100%';document.body.prepend(sheet);ctx=sheet.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,1200,900);}
      const stopFrame=Number(new URLSearchParams(location.search).get('frame'));
      const ticks=new URLSearchParams(location.search).has('frame')?Math.max(1,Math.ceil(stopFrame/d.fps*60)):Math.ceil(d.frames.length/d.fps*60)-1;
      for(let i=0;i<ticks;i++) {
        Signer._tick();
        maxBodyOverlap=Math.max(maxBodyOverlap,Signer.bodyOverlap||0);
        if(sheetMode && sample<8 && i>=Math.round(sample*(ticks-1)/7)){
          const x=(sample%4)*300,y=Math.floor(sample/4)*450;
          ctx.drawImage(document.getElementById('cv'),x,y,300,420);
          ctx.fillStyle='#111';ctx.font='16px sans-serif';ctx.fillText('ID '+item.id+' | '+(i/60).toFixed(2)+'s',x+10,y+440);sample++;
        }
        for(const side of ['Left','Right']) {
          const b=Signer._bone(side+'Hand'), q=b.getWorldQuaternion(new THREE.Quaternion());
          finite=finite&&q.toArray().every(Number.isFinite);
          if(prev[side]) {const angle=q.angleTo(prev[side])*180/Math.PI;maxStep=Math.max(maxStep,angle);if(angle>25)jumpFrames++;}
          prev[side]=q.clone();
        }
      }
      Signer.stop();
      results.push({id:item.id,max_step_deg:Math.round(maxStep*100)/100,jump_frames:jumpFrames,body_overlap_mm:Math.round(maxBodyOverlap*1000),finite});
      out.textContent=`${results.length}/80`; await new Promise(resolve=>setTimeout(resolve,0));
    }
    out.textContent=JSON.stringify({baseline,signs:results.length,jump_frames:results.reduce((n,r)=>n+r.jump_frames,0),finite:results.every(r=>r.finite),results},null,2);
    out.dataset.complete='true';
  } catch(error) {out.textContent=error.stack;out.dataset.complete='error';}
};
document.head.append(script);
</script>
